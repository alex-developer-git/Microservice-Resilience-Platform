apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resilience-platform-api
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/limit-connections: "40"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.resilience-platform.local
      secretName: resilience-platform-api-tls
  rules:
    - host: api.resilience-platform.local
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /register-service
            pathType: Exact
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /circuit-breaker
            pathType: Prefix
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
          - path: /ws/status
            pathType: Exact
            backend:
              service:
                name: resilience-platform-api
                port:
                  name: http
