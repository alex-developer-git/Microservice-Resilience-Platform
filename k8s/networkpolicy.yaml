apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-platform-api
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resilience-platform
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-platform-db-migrations
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: db-migrations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resilience-platform
      app.kubernetes.io/component: db-migrations
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-platform-cleanup
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: cleanup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resilience-platform
      app.kubernetes.io/component: cleanup
  policyTypes:
    - Egress
  egress:
    - {}
