apiVersion: v1
kind: ConfigMap
metadata:
  name: resilience-platform-config
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: api
data:
  APP_NAME: "Microservice Resilience Platform"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CELERY_TASK_NAME: "resilience_platform.process_event"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "resilience-platform-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:4317"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_FAIL_OPEN: "true"
  RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
  RATE_LIMIT_GLOBAL_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_REGISTER_SERVICE_REQUESTS: "10"
  RATE_LIMIT_HEALTH_CHECK_REQUESTS: "60"
  RATE_LIMIT_CIRCUIT_BREAKER_REQUESTS: "10"
