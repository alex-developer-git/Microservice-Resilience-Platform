apiVersion: batch/v1
kind: CronJob
metadata:
  name: resilience-platform-cleanup
  namespace: resilience-platform
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: cleanup
spec:
  schedule: "0 3 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: resilience-platform
            app.kubernetes.io/component: cleanup
        spec:
          serviceAccountName: resilience-platform
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: resilience-platform:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -c
                - "import logging; logging.basicConfig(level=logging.INFO); logging.info('cleanup job placeholder completed')"
              envFrom:
                - configMapRef:
                    name: resilience-platform-config
                - secretRef:
                    name: resilience-platform-secrets
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
