apiVersion: batch/v1
kind: Job
metadata:
  name: resilience-platform-db-migrations
  namespace: resilience-platform
  annotations:
    checkov.io/skip1: CKV_K8S_43=Release deployments should replace the example tag with an immutable image digest.
    checkov.io/skip2: CKV_K8S_35=Runtime configuration is read from environment variables provided by ExternalSecrets.
  labels:
    app.kubernetes.io/name: resilience-platform
    app.kubernetes.io/component: db-migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilience-platform
        app.kubernetes.io/component: db-migrations
    spec:
      serviceAccountName: resilience-platform
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: ghcr.io/alex-developer-git/microservice-resilience-platform:0.1.0
          imagePullPolicy: Always
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: resilience-platform-config
            - secretRef:
                name: resilience-platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
