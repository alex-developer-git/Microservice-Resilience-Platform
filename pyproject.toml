[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
  \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", ".pytest_cache", "__pycache__"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
