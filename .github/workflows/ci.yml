name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check .

      - name: Check import order with isort
        run: isort --check-only .

      - name: Lint with flake8
        run: flake8 app tests main.py

      - name: Type check with mypy
        run: mypy app main.py

      - name: Scan Python code with Bandit
        run: bandit -r app main.py -c pyproject.toml

      - name: Scan dependencies with Safety
        run: safety check --full-report

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest -m "not integration" \
            --cov=app \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  kubernetes-security:
    name: Kubernetes Security
    runs-on: ubuntu-latest
    needs:
      - code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart values
        run: |
          helm template ingress-nginx ingress-nginx \
            --repo https://kubernetes.github.io/ingress-nginx \
            --version 4.15.1 \
            --namespace ingress-nginx \
            --values infra/ingress-nginx/values.yaml > /dev/null
          helm template kube-prometheus-stack oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version 89.2.3 \
            --namespace monitoring \
            --values infra/kube-prometheus-stack/values.yaml > /dev/null
          helm template prometheus-adapter oci://ghcr.io/prometheus-community/charts/prometheus-adapter \
            --version 5.3.0 \
            --namespace monitoring \
            --values infra/prometheus-adapter/values.yaml > /dev/null

      - name: Render Kubernetes manifests
        run: |
          mkdir -p build/security
          kubectl kustomize k8s --load-restrictor=LoadRestrictionsNone > build/security/k8s-rendered.yaml
          kubectl kustomize k8s/canary --load-restrictor=LoadRestrictionsNone > build/security/k8s-canary-rendered.yaml
          kubectl kustomize k8s/kind --load-restrictor=LoadRestrictionsNone > build/security/k8s-kind-rendered.yaml
          kubectl kustomize k8s/observability --load-restrictor=LoadRestrictionsNone > build/security/k8s-observability-rendered.yaml

      - name: Validate Kubernetes schemas with kubeconform
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:latest \
              -strict \
              -ignore-missing-schemas \
              -summary \
              build/security/k8s-rendered.yaml \
              build/security/k8s-canary-rendered.yaml \
              build/security/k8s-kind-rendered.yaml \
              build/security/k8s-observability-rendered.yaml

      - name: Scan Kubernetes manifests with Checkov
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            bridgecrew/checkov:latest \
              -f build/security/k8s-rendered.yaml \
              -f build/security/k8s-canary-rendered.yaml \
              -f build/security/k8s-observability-rendered.yaml \
              --framework kubernetes \
              --quiet

  k8s-integration:
    name: Kubernetes Integration Tests
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: resilience-platform
          wait: 120s

      - name: Install ingress-nginx
        run: |
          if ! helm upgrade --install ingress-nginx ingress-nginx \
              --repo https://kubernetes.github.io/ingress-nginx \
              --version 4.15.1 \
              --namespace ingress-nginx \
              --create-namespace \
              --values infra/ingress-nginx/values.yaml \
              --set controller.service.type=ClusterIP \
              --set controller.admissionWebhooks.enabled=false \
              --wait \
              --timeout 7m; then
            kubectl -n ingress-nginx get all -o wide || true
            kubectl -n ingress-nginx describe pods || true
            kubectl -n ingress-nginx logs deployment/ingress-nginx-controller \
              --all-containers=true --tail=200 > ingress-controller.log 2>&1 || true
            cat ingress-controller.log
            grep -Ei '\[emerg\]|permission denied|invalid|error' ingress-controller.log \
              | tail -1 \
              | sed -e 's/%/%25/g' -e 's/^/::error title=Ingress controller log::/' || true
            exit 1
          fi

      - name: Build application image
        run: docker build -t resilience-platform:latest .

      - name: Load image into kind
        run: kind load docker-image resilience-platform:latest --name resilience-platform

      - name: Deploy application to kind
        run: kubectl kustomize k8s/kind --load-restrictor=LoadRestrictionsNone | kubectl apply -f -

      - name: Wait for test dependencies
        run: |
          kubectl -n resilience-platform rollout status deployment/postgres --timeout=180s
          kubectl -n resilience-platform rollout status deployment/redis --timeout=180s
          kubectl -n resilience-platform rollout status deployment/rabbitmq --timeout=300s

      - name: Wait for API deployment
        run: kubectl -n resilience-platform rollout status deployment/resilience-platform-api --timeout=240s

      - name: Verify NGINX static response caching
        run: |
          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8443:443 > ingress-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap "kill ${port_forward_pid}" EXIT

          for attempt in {1..30}; do
            if curl --fail --insecure --silent --show-error \
              --header 'Host: api.resilience-platform.local' \
              https://127.0.0.1:8443/health > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat ingress-port-forward.log
              exit 1
            fi
            sleep 2
          done

          assert_cached() {
            path=$1
            name=$2
            curl --fail --insecure --silent --show-error \
              --header 'Host: api.resilience-platform.local' \
              --dump-header "${name}-first.headers" \
              --output "${name}-first.body" \
              "https://127.0.0.1:8443${path}"
            curl --fail --insecure --silent --show-error \
              --header 'Host: api.resilience-platform.local' \
              --dump-header "${name}-second.headers" \
              --output "${name}-second.body" \
              "https://127.0.0.1:8443${path}"

            if ! grep -qi '^x-cache-status: MISS' "${name}-first.headers" || \
               ! grep -qi '^x-cache-status: HIT' "${name}-second.headers" || \
               ! cmp -s "${name}-first.body" "${name}-second.body"; then
              echo "::error title=Static cache mismatch::Expected MISS then HIT with identical bodies for ${path}"
              cat "${name}-first.headers"
              cat "${name}-second.headers"
              exit 1
            fi

            first_correlation=$(grep -i '^x-correlation-id:' "${name}-first.headers" | tr -d '\r')
            second_correlation=$(grep -i '^x-correlation-id:' "${name}-second.headers" | tr -d '\r')
            if [ -z "${first_correlation}" ] || [ -z "${second_correlation}" ] || \
               [ "${first_correlation}" = "${second_correlation}" ] || \
               grep -qi '^x-ratelimit-' "${name}-first.headers" || \
               grep -qi '^x-ratelimit-' "${name}-second.headers"; then
              echo "::error title=Cached metadata mismatch::Correlation IDs must remain per-request and rate-limit headers must not be cached for ${path}"
              cat "${name}-first.headers"
              cat "${name}-second.headers"
              exit 1
            fi
          }

          assert_cached /openapi.json openapi
          assert_cached /docs docs
          assert_cached /redoc redoc

          curl --fail --insecure --silent --show-error \
            --header 'Host: api.resilience-platform.local' \
            --header 'Authorization: Bearer cache-bypass-test' \
            --dump-header authorized-static.headers \
            --output /dev/null \
            https://127.0.0.1:8443/openapi.json
          if ! grep -qi '^x-cache-status: BYPASS' authorized-static.headers; then
            echo "::error title=Authenticated cache bypass failed::Expected BYPASS for an authorized static request"
            cat authorized-static.headers
            exit 1
          fi

          curl --fail --insecure --silent --show-error \
            --header 'Host: api.resilience-platform.local' \
            --dump-header health-first.headers \
            --output /dev/null \
            https://127.0.0.1:8443/health
          curl --fail --insecure --silent --show-error \
            --header 'Host: api.resilience-platform.local' \
            --dump-header health-second.headers \
            --output /dev/null \
            https://127.0.0.1:8443/health
          if ! grep -qi '^x-cache-status: BYPASS' health-first.headers || \
             ! grep -qi '^x-cache-status: BYPASS' health-second.headers; then
            echo "::error title=Dynamic cache bypass failed::Expected BYPASS for /health"
            cat health-first.headers
            cat health-second.headers
            exit 1
          fi

          register_status=$(curl --insecure --silent --show-error \
            --header 'Host: api.resilience-platform.local' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --dump-header register.headers \
            --output /dev/null \
            --write-out '%{http_code}' \
            https://127.0.0.1:8443/register-service)
          register_cache_status=$(grep -i '^x-cache-status:' register.headers | tr -d '\r' || true)
          register_rate_limit=$(grep -i '^x-ratelimit-limit:' register.headers | tr -d '\r' || true)
          if [ "${register_status}" != "422" ] || \
             ! grep -qi '^x-cache-status: BYPASS' register.headers || \
             ! grep -qi '^x-ratelimit-limit: 2' register.headers; then
            echo "::error title=Registration cache bypass failed::Expected HTTP 422, BYPASS and rate limit 2; got HTTP ${register_status}, '${register_cache_status:-missing}', '${register_rate_limit:-missing}'"
            cat register.headers
            exit 1
          fi

      - name: Smoke test API endpoints
        run: |
          kubectl -n resilience-platform port-forward svc/resilience-platform-api 8080:80 > port-forward.log 2>&1 &
          port_forward_pid=$!
          trap "kill ${port_forward_pid}" EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 2
          done

          cat port-forward.log
          exit 1

      - name: Verify Redis-backed application rate limiting
        run: |
          kubectl -n resilience-platform port-forward svc/resilience-platform-api 8080:80 > rate-limit-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap "kill ${port_forward_pid}" EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat rate-limit-port-forward.log
              exit 1
            fi
            sleep 2
          done

          first_status=$(curl --silent --show-error --header 'Content-Type: application/json' \
            --header 'X-Forwarded-For: 198.51.100.25' --data '{}' \
            --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/register-service)
          second_status=$(curl --silent --show-error --header 'Content-Type: application/json' \
            --header 'X-Forwarded-For: 198.51.100.25' --data '{}' \
            --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/register-service)
          third_status=$(curl --silent --show-error --dump-header rate-limit.headers --output rate-limit.json \
            --header 'Content-Type: application/json' --header 'X-Forwarded-For: 198.51.100.25' \
            --data '{}' --write-out "%{http_code}" \
            http://127.0.0.1:8080/register-service)

          if [ "${first_status}" != "422" ] || [ "${second_status}" != "422" ] || [ "${third_status}" != "429" ]; then
            echo "::error title=Rate limit status mismatch::Expected 422,422,429; got ${first_status},${second_status},${third_status}"
            cat rate-limit.json
            exit 1
          fi
          if ! grep -qi '^retry-after:' rate-limit.headers || \
             ! grep -qi '^x-ratelimit-limit: 2' rate-limit.headers || \
             ! grep -q 'rate_limit_exceeded' rate-limit.json; then
            echo "::error title=Rate limit response mismatch::Missing expected headers or error body"
            cat rate-limit.headers
            cat rate-limit.json
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/health > /dev/null

      - name: Show Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n resilience-platform get all
          kubectl -n resilience-platform describe pods
          kubectl -n resilience-platform logs deployment/postgres --tail=200 || true
          kubectl -n resilience-platform logs deployment/redis --tail=200 || true
          kubectl -n resilience-platform logs deployment/rabbitmq --tail=200 || true
          kubectl -n resilience-platform logs deployment/resilience-platform-api -c api --tail=200 || true
          kubectl -n resilience-platform logs deployment/resilience-platform-api -c wait-for-dependencies --tail=200 || true
          kubectl -n ingress-nginx logs deployment/ingress-nginx-controller --tail=200 || true

  build:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
      - k8s-integration
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:ci-scan

      - name: Scan image vulnerabilities with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json \
              --output trivy-results.json \
              "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:ci-scan"

      - name: Fail on HIGH or CRITICAL image vulnerabilities
        run: |
          python - <<'PY'
          import json
          import sys

          with open("trivy-results.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          vulnerabilities = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities", [])
          ]
          if vulnerabilities:
              for vulnerability in vulnerabilities:
                  print(
                      f"{vulnerability.get('Severity')}: "
                      f"{vulnerability.get('VulnerabilityID')} in {vulnerability.get('PkgName')}"
                  )
              sys.exit(1)

          print("No HIGH or CRITICAL image vulnerabilities found.")
          PY

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image to registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

  notify-telegram:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
      - k8s-integration
      - build
    if: always() && github.event_name == 'push'

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          KUBERNETES_SECURITY_RESULT: ${{ needs.kubernetes-security.result }}
          K8S_INTEGRATION_RESULT: ${{ needs.k8s-integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          STATUS="SUCCESS"
          if [ "${CODE_QUALITY_RESULT}" != "success" ] || \
             [ "${UNIT_TESTS_RESULT}" != "success" ] || \
             [ "${KUBERNETES_SECURITY_RESULT}" != "success" ] || \
             [ "${K8S_INTEGRATION_RESULT}" != "success" ] || \
             [ "${BUILD_RESULT}" != "success" ]; then
            STATUS="FAILED"
          fi

          MESSAGE="Microservice Resilience Platform CI ${STATUS}
          branch: ${REF_NAME}
          commit: ${COMMIT_SHA}
          code-quality: ${CODE_QUALITY_RESULT}
          unit-tests: ${UNIT_TESTS_RESULT}
          kubernetes-security: ${KUBERNETES_SECURITY_RESULT}
          k8s-integration: ${K8S_INTEGRATION_RESULT}
          build: ${BUILD_RESULT}
          run: ${RUN_URL}"

          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"
