name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check .

      - name: Check import order with isort
        run: isort --check-only .

      - name: Lint with flake8
        run: flake8 app tests main.py

      - name: Type check with mypy
        run: mypy app main.py

      - name: Scan Python code with Bandit
        run: bandit -r app main.py -c pyproject.toml

      - name: Scan dependencies with Safety
        run: safety check --full-report

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest -m "not integration" \
            --cov=app \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  kubernetes-security:
    name: Kubernetes Security
    runs-on: ubuntu-latest
    needs:
      - code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate monitoring chart values
        run: |
          helm template kube-prometheus-stack oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version 89.2.3 \
            --namespace monitoring \
            --values infra/kube-prometheus-stack/values.yaml > /dev/null
          helm template prometheus-adapter oci://ghcr.io/prometheus-community/charts/prometheus-adapter \
            --version 5.3.0 \
            --namespace monitoring \
            --values infra/prometheus-adapter/values.yaml > /dev/null

      - name: Render Kubernetes manifests
        run: |
          mkdir -p build/security
          kubectl kustomize k8s --load-restrictor=LoadRestrictionsNone > build/security/k8s-rendered.yaml
          kubectl kustomize k8s/canary --load-restrictor=LoadRestrictionsNone > build/security/k8s-canary-rendered.yaml
          kubectl kustomize k8s/kind --load-restrictor=LoadRestrictionsNone > build/security/k8s-kind-rendered.yaml
          kubectl kustomize k8s/observability --load-restrictor=LoadRestrictionsNone > build/security/k8s-observability-rendered.yaml

      - name: Validate Kubernetes schemas with kubeconform
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:latest \
              -strict \
              -ignore-missing-schemas \
              -summary \
              build/security/k8s-rendered.yaml \
              build/security/k8s-canary-rendered.yaml \
              build/security/k8s-kind-rendered.yaml \
              build/security/k8s-observability-rendered.yaml

      - name: Scan Kubernetes manifests with Checkov
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            bridgecrew/checkov:latest \
              -f build/security/k8s-rendered.yaml \
              -f build/security/k8s-canary-rendered.yaml \
              -f build/security/k8s-observability-rendered.yaml \
              --framework kubernetes \
              --quiet

  k8s-integration:
    name: Kubernetes Integration Tests
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: resilience-platform
          wait: 120s

      - name: Build application image
        run: docker build -t resilience-platform:latest .

      - name: Load image into kind
        run: kind load docker-image resilience-platform:latest --name resilience-platform

      - name: Deploy application to kind
        run: kubectl kustomize k8s/kind --load-restrictor=LoadRestrictionsNone | kubectl apply -f -

      - name: Wait for test dependencies
        run: |
          kubectl -n resilience-platform rollout status deployment/postgres --timeout=180s
          kubectl -n resilience-platform rollout status deployment/redis --timeout=180s
          kubectl -n resilience-platform rollout status deployment/rabbitmq --timeout=300s

      - name: Wait for API deployment
        run: kubectl -n resilience-platform rollout status deployment/resilience-platform-api --timeout=240s

      - name: Smoke test API endpoints
        run: |
          kubectl -n resilience-platform port-forward svc/resilience-platform-api 8080:80 > port-forward.log 2>&1 &
          port_forward_pid=$!
          trap "kill ${port_forward_pid}" EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 2
          done

          cat port-forward.log
          exit 1

      - name: Verify Redis-backed application rate limiting
        run: |
          kubectl -n resilience-platform port-forward svc/resilience-platform-api 8080:80 > rate-limit-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap "kill ${port_forward_pid}" EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat rate-limit-port-forward.log
              exit 1
            fi
            sleep 2
          done

          first_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            http://127.0.0.1:8080/health/rate-limit-ci-missing)
          second_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            http://127.0.0.1:8080/health/rate-limit-ci-missing)
          third_status=$(curl --silent --show-error --dump-header rate-limit.headers --output rate-limit.json \
            --write-out "%{http_code}" http://127.0.0.1:8080/health/rate-limit-ci-missing)

          test "${first_status}" = "404"
          test "${second_status}" = "404"
          test "${third_status}" = "429"
          grep -qi '^retry-after:' rate-limit.headers
          grep -qi '^x-ratelimit-limit: 2' rate-limit.headers
          grep -q 'rate_limit_exceeded' rate-limit.json
          curl -fsS http://127.0.0.1:8080/health > /dev/null

      - name: Show Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n resilience-platform get all
          kubectl -n resilience-platform describe pods
          kubectl -n resilience-platform logs deployment/postgres --tail=200 || true
          kubectl -n resilience-platform logs deployment/redis --tail=200 || true
          kubectl -n resilience-platform logs deployment/rabbitmq --tail=200 || true
          kubectl -n resilience-platform logs deployment/resilience-platform-api -c api --tail=200 || true
          kubectl -n resilience-platform logs deployment/resilience-platform-api -c wait-for-dependencies --tail=200 || true

  build:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
      - k8s-integration
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:ci-scan

      - name: Scan image vulnerabilities with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json \
              --output trivy-results.json \
              "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:ci-scan"

      - name: Fail on HIGH or CRITICAL image vulnerabilities
        run: |
          python - <<'PY'
          import json
          import sys

          with open("trivy-results.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          vulnerabilities = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities", [])
          ]
          if vulnerabilities:
              for vulnerability in vulnerabilities:
                  print(
                      f"{vulnerability.get('Severity')}: "
                      f"{vulnerability.get('VulnerabilityID')} in {vulnerability.get('PkgName')}"
                  )
              sys.exit(1)

          print("No HIGH or CRITICAL image vulnerabilities found.")
          PY

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image to registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

  notify-telegram:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - kubernetes-security
      - k8s-integration
      - build
    if: always() && github.event_name == 'push'

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          KUBERNETES_SECURITY_RESULT: ${{ needs.kubernetes-security.result }}
          K8S_INTEGRATION_RESULT: ${{ needs.k8s-integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          STATUS="SUCCESS"
          if [ "${CODE_QUALITY_RESULT}" != "success" ] || \
             [ "${UNIT_TESTS_RESULT}" != "success" ] || \
             [ "${KUBERNETES_SECURITY_RESULT}" != "success" ] || \
             [ "${K8S_INTEGRATION_RESULT}" != "success" ] || \
             [ "${BUILD_RESULT}" != "success" ]; then
            STATUS="FAILED"
          fi

          MESSAGE="Microservice Resilience Platform CI ${STATUS}
          branch: ${REF_NAME}
          commit: ${COMMIT_SHA}
          code-quality: ${CODE_QUALITY_RESULT}
          unit-tests: ${UNIT_TESTS_RESULT}
          kubernetes-security: ${KUBERNETES_SECURITY_RESULT}
          k8s-integration: ${K8S_INTEGRATION_RESULT}
          build: ${BUILD_RESULT}
          run: ${RUN_URL}"

          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"
