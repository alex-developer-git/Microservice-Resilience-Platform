services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resilience-platform:dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_NAME: Microservice Resilience Platform
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://resilience:resilience@postgres:5432/resilience
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: pyamqp://resilience:resilience@rabbitmq:5672//
      CELERY_TASK_NAME: resilience_platform.process_event
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: resilience-platform-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_PROPAGATORS: tracecontext,baggage
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "true"
      RATE_LIMIT_TRUST_FORWARDED_FOR: "false"
      RATE_LIMIT_GLOBAL_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_REGISTER_SERVICE_REQUESTS: "10"
      RATE_LIMIT_HEALTH_CHECK_REQUESTS: "60"
      RATE_LIMIT_CIRCUIT_BREAKER_REQUESTS: "10"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./main.py:/app/main.py:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - backend
      - observability

  celery-worker:
    image: resilience-platform:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_worker.celery_app worker --loglevel=INFO
    environment:
      LOG_LEVEL: INFO
      CELERY_BROKER_URL: pyamqp://resilience:resilience@rabbitmq:5672//
      CELERY_TASK_NAME: resilience_platform.process_event
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: resilience-platform-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_PROPAGATORS: tracecontext,baggage
    volumes:
      - ./app:/app/app:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - observability

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: resilience
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilience -d resilience"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: resilience
      RABBITMQ_DEFAULT_PASS: resilience
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    networks:
      - backend
      - observability

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
    networks:
      - backend
      - observability

  loki:
    image: grafana/loki:3.2.1
    profiles:
      - logging
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.2.1
    profiles:
      - logging
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - observability

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:

networks:
  backend:
    driver: bridge
  observability:
    driver: bridge
